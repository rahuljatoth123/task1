<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      cursor: pointer;
      border-radius: 10px;
      transition: transform 0.2s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .modal-content {
      margin-top: 5%;
      max-width: 80%;
      height: auto;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 30px; right: 50px;
      color: white;
      font-size: 35px;
      cursor: pointer;
    }

    .modal-caption {
      color: white;
      padding: 10px;
      font-size: 18px;
    }

    .prev, .next {
      position: absolute;
      top: 50%;
      color: white;
      font-size: 40px;
      padding: 10px;
      cursor: pointer;
      user-select: none;
      transform: translateY(-50%);
    }

    .prev { left: 20px; }
    .next { right: 20px; }
  </style>
</head>
<body>
  <h1>Image Gallery</h1>
  <div class="gallery">
    <img src="https://via.placeholder.com/300?text=Image+1" alt="Image 1">
    <img src="https://via.placeholder.com/300?text=Image+2" alt="Image 2">
    <img src="https://via.placeholder.com/300?text=Image+3" alt="Image 3">
    <img src="https://via.placeholder.com/300?text=Image+4" alt="Image 4">
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modal-img">
    <div class="modal-caption" id="caption"></div>
    <a class="prev">&#10094;</a>
    <a class="next">&#10095;</a>
  </div>

  <script>
    const images = document.querySelectorAll('.gallery img');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const caption = document.getElementById('caption');
    const closeBtn = document.querySelector('.close');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');

    let currentIndex = 0;

    function openModal(index) {
      currentIndex = index;
      modal.style.display = 'block';
      modalImg.src = images[index].src;
      caption.textContent = images[index].alt;
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % images.length;
      openModal(currentIndex);
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      openModal(currentIndex);
    }

    images.forEach((img, index) => {
      img.addEventListener('click', () => openModal(index));
    });

    closeBtn.addEventListener('click', closeModal);
    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);

    window.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // Keyboard navigation support
    document.addEventListener('keydown', (e) => {
      if (modal.style.display === 'block') {
        if (e.key === 'ArrowRight') showNext();
        if (e.key === 'ArrowLeft') showPrev();
        if (e.key === 'Escape') closeModal();
      }
    });
  </script>
</body>
</html>
